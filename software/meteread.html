<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METEREAD - CodeKokeshi</title>
  <meta name="description" content="METEREAD is an Android-based analog water meter reading application using LeNet-5 CNN for Carmona Water District customers." />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      color: #f7fdff;
      background:
        radial-gradient(circle at 18% 12%, rgba(134, 239, 255, 0.34), transparent 28rem),
        radial-gradient(circle at 82% 28%, rgba(45, 212, 191, 0.24), transparent 24rem),
        linear-gradient(145deg, #042c46 0%, #075b78 44%, #03202f 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      left: 0;
      width: 200%;
      height: 18rem;
      pointer-events: none;
      opacity: 0.38;
      background-repeat: repeat-x;
      background-size: 50% 100%;
      z-index: 0;
    }

    body::before {
      top: -5rem;
      background-image:
        radial-gradient(ellipse at 25% 100%, transparent 0 48%, rgba(125, 211, 252, 0.34) 49% 53%, transparent 54%),
        radial-gradient(ellipse at 75% 100%, transparent 0 48%, rgba(45, 212, 191, 0.28) 49% 53%, transparent 54%);
    }

    body::after {
      bottom: -8rem;
      background-image:
        radial-gradient(ellipse at 25% 0%, transparent 0 48%, rgba(186, 230, 253, 0.34) 49% 53%, transparent 54%),
        radial-gradient(ellipse at 75% 0%, transparent 0 48%, rgba(94, 234, 212, 0.26) 49% 53%, transparent 54%);
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .shell {
      width: min(960px, 100%);
      max-width: 100%;
      min-width: 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(247, 253, 255, 0.78);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 28px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: #ffffff;
      transform: translateX(-3px);
    }

    .hero {
      position: relative;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(186, 230, 253, 0.34);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08)),
        rgba(3, 32, 47, 0.62);
      box-shadow: 0 28px 90px rgba(1, 22, 35, 0.48);
      backdrop-filter: blur(18px);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto -10% -7rem;
      height: 15rem;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(125, 211, 252, 0.36) 0 24%, transparent 25%),
        radial-gradient(ellipse at 50% 0%, rgba(34, 211, 238, 0.28) 0 28%, transparent 29%),
        radial-gradient(ellipse at 82% 0%, rgba(45, 212, 191, 0.34) 0 24%, transparent 25%);
      opacity: 0.85;
    }

    .hero__content {
      position: relative;
      min-width: 0;
      padding: clamp(32px, 7vw, 72px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #bae6fd;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .eyebrow::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #67e8f9;
      box-shadow: 0 0 24px rgba(103, 232, 249, 0.9);
    }

    h1 {
      max-width: 10ch;
      color: #ffffff;
      font-size: clamp(38px, 10.5vw, 112px);
      line-height: 0.9;
      letter-spacing: 0;
      margin-bottom: 24px;
    }

    .description {
      max-width: 760px;
      color: rgba(247, 253, 255, 0.84);
      font-size: clamp(18px, 2.2vw, 25px);
      line-height: 1.5;
      margin-bottom: 34px;
      overflow-wrap: break-word;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.58);
    }

    .button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    .button--primary {
      color: #042c46;
      background: #a5f3fc;
      border-color: #a5f3fc;
      box-shadow: 0 16px 40px rgba(34, 211, 238, 0.28);
    }

    .button--primary:hover,
    .button--primary:focus-visible {
      background: #cffafe;
      border-color: #cffafe;
    }

    .button--ghost {
      background: rgba(255, 255, 255, 0.1);
    }

    .button svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    @media (max-width: 560px) {
      .page {
        align-items: start;
        padding: 24px 14px;
      }

      .shell {
        width: 100%;
      }

      .hero__content {
        padding: 28px 20px 34px;
      }

      h1 {
        font-size: clamp(38px, 11vw, 44px);
      }

      .actions,
      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <a class="back-link" href="/software" aria-label="Back to software page">
        <span aria-hidden="true">&larr;</span>
        Software
      </a>

      <section class="hero" aria-labelledby="meteread-title">
        <div class="hero__content">
          <p class="eyebrow">Water Meter Reading App</p>
          <h1 id="meteread-title">METEREAD</h1>
          <p class="description">
            An Android-Based Analog Water Meter Reading Application Using LeNet-5 CNN for Carmona Water District Customers
          </p>

          <div class="actions" aria-label="METEREAD links">
            <a class="button button--primary" href="https://drive.usercontent.google.com/download?id=1ReUPLV8nTbZ7U4nbGMDEy-xvcqNQ4uNA&amp;export=download">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Download APK
            </a>
            <a class="button button--ghost" href="https://github.com/CodeKokeshi/MeterSnap" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.16 1.18.92-.26 1.9-.38 2.88-.39.98.01 1.96.13 2.88.39 2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.24 2.75.12 3.04.74.8 1.18 1.83 1.18 3.08 0 4.42-2.69 5.39-5.26 5.67.42.36.78 1.07.78 2.16v3.14c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z" />
              </svg>
              GitHub Repo
            </a>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
